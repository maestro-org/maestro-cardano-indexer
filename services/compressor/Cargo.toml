[package]
name = "compressor"
version = "0.1.0"
edition = "2021"
description = "Cardano light node: block storage with resolved inputs, served over gRPC"
license.workspace = true
repository.workspace = true


[dependencies]
pallas = "1.0.0"
pallas-configs = "1.0.0"
gasket = { version = "^0.5", features = ["derive"] }
clap = { version = "4.3.0", features = ["derive"] }
config = { version = "0.13.3", default-features = false, features = [
    "toml",
    "json",
] }
rocksdb = { git = "https://github.com/rust-rocksdb/rust-rocksdb.git", rev = "3bccfdfd931359aed5a2b28884b1697f6a7f5caf", default-features = false, features = [
    "multi-threaded-cf",
] }
tonic = { version = "0.11.0", features = ["tls"] }
tonic-web = "0.11.0"
miette = { version = "5.9.0", features = ["fancy"] }
tokio = { version = "1.36.0", features = ["rt", "rt-multi-thread"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
thiserror = "1.0.30"
hex = "0.4.3"
serde = "1.0.196"
async-trait = "0.1.68"
bincode = "1.3.3"
tempfile = "3.9.0"
prost = "0.12"
serde_with = "3.4.0"
futures-core = "0.3.30"
futures-util = "0.3.30"
async-stream = "0.3.5"
actix-web = "4"
signal-hook = "0.3.17"
once_cell = "1.10"
prometheus = "0.13.0"

[build-dependencies]
tonic-build = "0.11.0"

[lints]
workspace = true
